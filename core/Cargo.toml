[package]
name = "ribbit-core"
version = "0.1.0"
description = "Recorded speech to finished text: STT with failover, cleanup, LLM edit, vocab"
edition = "2021"

# No Tauri here: the desktop app and ribbit-server both build on this crate,
# and the server must compile on a bare Linux box without GTK/WebKit.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }
chrono = "0.4"
dirs = "6"
