[package]
name = "ribbit"
version = "0.7.70"
description = "Voice-to-text dictation app"
authors = ["Oleg Peregudov"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ribbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }
# Direct Unicode keyboard input — types the transcript at the cursor
# without touching the system clipboard.
enigo = "0.2"
chrono = "0.4"
dirs = "6"
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Used to round the borderless NSWindow corners — Tauri does not expose this
# directly. Without it the transparent window leaves wallpaper showing
# through the corner gaps on macOS.
cocoa = "0.26"
objc = "0.2"
# ObjC block for AVCaptureDevice's requestAccess completion handler (mic prompt).
block = "0.1"
# Turns the borderless "main" window into a non-activating NSPanel so it can
# surface on the current Space *over another app's full-screen Space* without
# activating Ribbit (which would teleport the user to the window's home
# desktop). A plain NSWindow cannot do this — macOS refuses to show it over a
# foreign full-screen app. This is the mechanism Spotlight/Raycast use.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

