[package]
name = "ribbit"
version = "0.7.40"
description = "Voice-to-text dictation app"
authors = ["Oleg Peregudov"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ribbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }
# Direct Unicode keyboard input — types the transcript at the cursor
# without touching the system clipboard.
enigo = "0.2"
chrono = "0.4"
dirs = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
rodio = { version = "0.19", default-features = false, features = ["vorbis"] }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Used to round the borderless NSWindow corners — Tauri does not expose this
# directly. Without it the transparent window leaves wallpaper showing
# through the corner gaps on macOS.
cocoa = "0.26"
objc = "0.2"

