<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ribbit</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <div class="header">
        <div id="status-icon" class="idle">
          <svg viewBox="0 0 36 30" width="28" height="23" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="12" cy="9" r="7"/>
            <circle cx="24" cy="9" r="7"/>
            <circle cx="12.5" cy="8" r="2.5" fill="currentColor" stroke="none"/>
            <circle cx="24.5" cy="8" r="2.5" fill="currentColor" stroke="none"/>
            <path d="M 4 14 C 2 25 14 28 18 28 C 22 28 34 25 32 14"/>
            <path d="M 12 21 Q 18 25 24 21" stroke-width="1"/>
          </svg>
        </div>
        <div class="header-text">
          <div class="app-title">ribbit</div>
          <div id="status-detail">ready</div>
        </div>
        <div class="header-right">
          <kbd>ctrl+alt+space</kbd>
          <button id="debug-btn" title="Debug log">&gt;_</button>
        </div>
      </div>

      <div id="log-entries"></div>

      <div id="debug-panel" style="display:none">
        <div class="debug-header">
          <span>debug log</span>
          <button id="debug-close">&times;</button>
        </div>
        <pre id="debug-content"></pre>
      </div>

      <div id="setup" style="display:none">
        <p>enter your openai api key:</p>
        <form id="key-form">
          <input type="password" id="api-key-input" placeholder="sk-..." />
          <button type="submit">save</button>
        </form>
      </div>
    </main>
  </body>
</html>
