<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ribbit</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <div class="header">
        <div id="status-icon" class="idle">
          <svg viewBox="0 0 100 100" width="48" height="48">
            <circle cx="50" cy="55" r="40" fill="currentColor" />
            <circle cx="32" cy="35" r="12" fill="currentColor" />
            <circle cx="68" cy="35" r="12" fill="currentColor" />
            <circle cx="32" cy="35" r="6" fill="white" />
            <circle cx="68" cy="35" r="6" fill="white" />
            <circle cx="33" cy="34" r="3" fill="#333" />
            <circle cx="69" cy="34" r="3" fill="#333" />
            <path d="M 30 65 Q 50 80 70 65" stroke="#333" stroke-width="2" fill="none" />
          </svg>
        </div>
        <div class="header-text">
          <div class="app-title">Ribbit</div>
          <div id="status-detail">Ready</div>
        </div>
        <div class="hotkey-hint"><kbd>Ctrl+Win+Space</kbd></div>
        <button id="debug-btn" title="Debug log">&#x1f41b;</button>
      </div>

      <div id="log-entries"></div>

      <div id="debug-panel" style="display:none">
        <div class="debug-header">
          <span>Debug Log</span>
          <button id="debug-close">&times;</button>
        </div>
        <pre id="debug-content"></pre>
      </div>

      <div id="setup" style="display:none">
        <p>Enter your OpenAI API key:</p>
        <form id="key-form">
          <input type="password" id="api-key-input" placeholder="sk-..." />
          <button type="submit">Save</button>
        </form>
      </div>
    </main>
  </body>
</html>
