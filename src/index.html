<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ribbit</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <div class="header" data-tauri-drag-region>
        <div id="status-icon" class="idle">
          <img src="frog.png" width="32" height="32" alt="Ribbit" />
        </div>
        <div class="header-text" data-tauri-drag-region>
          <div class="app-title" data-tauri-drag-region>ribbit</div>
          <div id="status-detail">ready</div>
        </div>
        <div class="header-right">
          <kbd>ctrl+alt+space</kbd>
          <button id="debug-btn" title="Debug log">&gt;_</button>
          <button id="win-min" class="win-btn" title="Minimize">&#x2212;</button>
          <button id="win-close" class="win-btn win-close" title="Close">&#x2715;</button>
        </div>
      </div>

      <div id="log-entries"></div>

      <div id="debug-panel" style="display:none">
        <div class="debug-header">
          <span>debug log</span>
          <button id="debug-close">&times;</button>
        </div>
        <pre id="debug-content"></pre>
      </div>

      <div id="setup" style="display:none">
        <p>enter api key (groq gsk_ or openai sk-):</p>
        <form id="key-form">
          <input type="password" id="api-key-input" placeholder="gsk_... or sk-..." />
          <button type="submit">save</button>
        </form>
      </div>
    </main>
  </body>
</html>
