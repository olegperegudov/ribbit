name: Build Ribbit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Auto-bump patch version, commit, and tag
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Auto-bump version
        id: bump
        run: |
          # Read current version from tauri.conf.json
          CURRENT=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "Current version: $CURRENT"

          # Check if this commit already has a tag (avoid re-bumping version commits)
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Commit already tagged, skipping"
            exit 0
          fi

          # Check if last commit was a version bump (avoid infinite loop)
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == v* ]] || [[ "$LAST_MSG" == *"auto-bump"* ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Last commit was version bump, skipping"
            exit 0
          fi

          # Bump patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW="$MAJOR.$MINOR.$PATCH"
          TAG="v$NEW"
          echo "Bumping to: $NEW"

          # Update version in all files
          python3 -c "
          import json
          for f in ['src-tauri/tauri.conf.json']:
              d = json.load(open(f))
              d['version'] = '$NEW'
              json.dump(d, open(f, 'w'), indent=2)
              print(f'Updated {f}')
          "

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" src-tauri/Cargo.toml
          sed -i "s/v$CURRENT/v$NEW/" src/index.html

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$TAG auto-bump"
          git tag "$TAG"
          git push origin main "$TAG"

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

  # Run JS unit tests before any platform build. Rust tests run inside each
  # platform build (below) so we don't need to install Linux GTK deps just
  # to compile the Tauri crate on ubuntu.
  test:
    needs: version
    if: needs.version.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: JS unit tests (vitest)
        run: npm test

  build-windows:
    needs: [version, test]
    if: needs.version.outputs.skipped != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Rust unit tests
        working-directory: src-tauri
        # Use absolute path — macos-latest has a `cargo` shim earlier in PATH
        # that ignores rustup syntax; dtolnay installs the real cargo here.
        shell: bash
        run: "$HOME/.cargo/bin/cargo test --lib"

      - name: Set signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<__EOF__'
            printf '%s' "$SIGNING_KEY"
            echo ''
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      # tauri-action builds the app AND uploads it to the GitHub release in
      # one step. The build is reliable; the upload occasionally fails on a
      # transient GitHub API network timeout. GitHub has no native retry for a
      # `uses:` step, so the step is repeated once on failure — the retry
      # rebuilds from the warm Rust cache (~30s) and re-uploads.
      - name: Build Tauri app
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false

      - name: Build Tauri app (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false

  build-macos:
    # Native per-arch builds (arm64 + Intel), NOT a universal binary. A universal
    # (lipo'd) ad-hoc-signed bundle does not anchor macOS TCC grants reliably: the
    # microphone permission never sticks, so cpal re-triggers the system prompt on
    # every stream open and recording stays broken no matter how many times the
    # user clicks "Allow". A native per-arch bundle matches the running Mac exactly
    # and keeps the grant stable across launches. Combined with the stable
    # self-signed cert (see the keychain step below), the Accessibility/mic grants
    # now survive updates cert-to-cert — tcc_reset fires just once, on the
    # ad-hoc→cert migration. v0.7.52 shipped universal and broke the mic — this
    # keeps the proven per-arch build.
    #
    # Runs AFTER build-windows (not in parallel) on purpose: tauri-action publishes
    # latest.json by read-modify-merging the same release asset, so two jobs
    # uploading at once race on a stale read and silently drop platform keys (this
    # is what stranded Apple-Silicon users on "update failed"). The two per-arch
    # steps below run sequentially inside this one job, so the only cross-job
    # ordering left to pin is windows-before-macos.
    needs: [version, test, build-windows]
    if: needs.version.outputs.skipped != 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Rust unit tests
        working-directory: src-tauri
        # Use absolute path — macos-latest has a `cargo` shim earlier in PATH
        # that ignores rustup syntax; dtolnay installs the real cargo here.
        shell: bash
        run: "$HOME/.cargo/bin/cargo test --lib"

      # A self-signed cert only counts as a *valid* codesigning identity once its
      # root is trusted. Until then `security find-identity -v -p codesigning`
      # omits it, codesign reports "no identity found", and Tauri's bundler dies
      # with "failed to resolve signing identity". tauri-action's own
      # APPLE_CERTIFICATE import does NOT add trust, so we build the keychain
      # ourselves and trust the cert as a codeSign root (passwordless sudo on the
      # runner → no GUI auth), then hand the bundler only APPLE_SIGNING_IDENTITY.
      - name: Set up code-signing keychain (self-signed, trusted)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ribbit-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/ribbit.p12"
          CERT="$RUNNER_TEMP/ribbit-cert.pem"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$P12"

          # Dedicated keychain holds the signing identity (cert + private key).
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Let codesign use the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null

          # Our keychain first on the search list so the bundler finds the key.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # Trust the self-signed cert as a codeSign root in the System keychain.
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT"

          echo "Valid codesigning identities after trust:"
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::signing identity '$APPLE_SIGNING_IDENTITY' did not resolve"; exit 1; }

      # Two native per-arch builds, run sequentially (arm64, then Intel) inside
      # this single job. tauri-action builds AND uploads each in one step, merging
      # its platform key into the release's latest.json; running them in order —
      # and the whole job after the windows job — means no two uploads ever touch
      # latest.json at the same time, so every platform key survives. Each upload
      # can fail on a transient GitHub API timeout, so each is repeated once (the
      # rebuild is cache-warm).
      - name: Build Tauri app (Apple Silicon)
        id: build_arm
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false

      - name: Build Tauri app (Apple Silicon, retry)
        if: steps.build_arm.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false

      - name: Build Tauri app (Intel)
        id: build_intel
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target x86_64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false

      - name: Build Tauri app (Intel, retry)
        if: steps.build_intel.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target x86_64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false

      # Guard: the in-app updater is only as good as latest.json. Fetch the
      # manifest we just published and fail the build if any platform key is
      # missing or the version is wrong — a broken manifest must never ship
      # silently again (this is exactly the bug that stranded Apple-Silicon
      # users on an old version).
      - name: Verify updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json --clobber
          python3 - "$TAG" <<'PY'
          import json, sys
          tag = sys.argv[1]
          want = {"windows-x86_64", "darwin-aarch64", "darwin-x86_64"}
          m = json.load(open("latest.json"))
          plats = m.get("platforms", {})
          have = set(plats)
          missing = want - have
          if missing:
              print(f"::error::latest.json missing platform keys: {sorted(missing)} (present: {sorted(have)})")
              sys.exit(1)
          if f"v{m.get('version')}" != tag:
              print(f"::error::latest.json version {m.get('version')!r} != tag {tag!r}")
              sys.exit(1)
          # The macOS bundle must be per-arch, never universal: a lipo'd ad-hoc
          # binary fails to anchor TCC grants, so the microphone silently stops
          # working after an update. Catch a regression to universal here.
          for key in ("darwin-aarch64", "darwin-x86_64"):
              url = plats[key].get("url", "")
              if "universal" in url.lower():
                  print(f"::error::{key} points at a universal bundle ({url.split('/')[-1]}); macOS must ship per-arch or the mic breaks")
                  sys.exit(1)
          print(f"latest.json OK: version {m['version']}, platforms {sorted(have)}")
          PY
