name: Build Ribbit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Auto-bump patch version, commit, and tag
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.bump.outputs.skipped }}
      notes: ${{ steps.bump.outputs.notes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Auto-bump version
        id: bump
        run: |
          # Read current version from tauri.conf.json
          CURRENT=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "Current version: $CURRENT"

          # Check if this commit already has a tag (avoid re-bumping version commits)
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Commit already tagged, skipping"
            exit 0
          fi

          # Check if last commit was a version bump (avoid infinite loop)
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == v* ]] || [[ "$LAST_MSG" == *"auto-bump"* ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Last commit was version bump, skipping"
            exit 0
          fi

          # Bump patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW="$MAJOR.$MINOR.$PATCH"
          TAG="v$NEW"
          echo "Bumping to: $NEW"

          # Update version in all files
          python3 -c "
          import json
          for f in ['src-tauri/tauri.conf.json']:
              d = json.load(open(f))
              d['version'] = '$NEW'
              json.dump(d, open(f, 'w'), indent=2)
              print(f'Updated {f}')
          "

          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" src-tauri/Cargo.toml

          # Close the changelog's Unreleased section under this version and carry
          # its bullets into the release the tray's version item opens. Runs
          # before `git add -A` so the rewritten file goes in the bump commit.
          python3 .github/scripts/cut_release_notes.py "$NEW" > /tmp/release-notes.md
          {
            echo "notes<<RIBBIT_NOTES_EOF"
            cat /tmp/release-notes.md
            echo "RIBBIT_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          sed -i "s/v$CURRENT/v$NEW/" src/index.html

          # Commit and tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$TAG auto-bump"
          git tag "$TAG"
          git push origin main "$TAG"

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

  # Run JS unit tests before any platform build. Rust tests run inside each
  # platform build (below) so we don't need to install Linux GTK deps just
  # to compile the Tauri crate on ubuntu.
  test:
    needs: version
    if: needs.version.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: JS unit tests (vitest)
        run: npm test

      - name: Release-notes cutter tests
        working-directory: .github/scripts
        run: python3 test_cut_release_notes.py

  build-windows:
    needs: [version, test]
    if: needs.version.outputs.skipped != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Rust unit tests
        working-directory: src-tauri
        # Use absolute path — macos-latest has a `cargo` shim earlier in PATH
        # that ignores rustup syntax; dtolnay installs the real cargo here.
        shell: bash
        run: "$HOME/.cargo/bin/cargo test --lib"

      # tauri-action builds the app AND uploads it to the GitHub release in
      # one step. The build is reliable; the upload occasionally fails on a
      # transient GitHub API network timeout. GitHub has no native retry for a
      # `uses:` step, so the step is repeated once on failure — the retry
      # rebuilds from the warm Rust cache (~30s) and re-uploads.
      - name: Build Tauri app
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      - name: Build Tauri app (retry)
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      # Re-upload the installer under a stable, version-less name so the README
      # download button can link straight at the file
      # (releases/latest/download/<name>). Tauri's own asset names carry the
      # version, so any direct link to them dies on the next bump — which is why
      # the buttons used to dump the user on the releases page instead.
      - name: Publish stable-named Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          exe=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" Ribbit_Windows_Setup.exe
          gh release upload "$TAG" Ribbit_Windows_Setup.exe --clobber --repo "$GITHUB_REPOSITORY"

      # Stage check on the real OS: install what we are about to ship, launch
      # it, and demand it still be alive 10s later with the right version. A
      # tray app has no window to assert on — a living process IS the smoke
      # signal. Nothing here needs a mic: recording starts only on hotkey.
      - name: Smoke-test installed app
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = ".\Ribbit_Windows_Setup.exe"
          Write-Host "Installing $installer silently..."
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          # Tauri NSIS (installMode currentUser) installs under %LOCALAPPDATA%\<ProductName>.
          $installDir = Join-Path $env:LOCALAPPDATA "Ribbit"
          $app = Get-ChildItem (Join-Path $installDir "*.exe") -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "unins" } | Select-Object -First 1
          if (-not $app) { Write-Host "::error::installed binary not found under $installDir"; exit 1 }
          Write-Host "Installed: $($app.FullName)"

          $ver = $app.VersionInfo.ProductVersion
          Write-Host "ProductVersion: $ver"
          if ("v$ver" -ne $env:TAG) {
            Write-Host "::error::installed version '$ver' != tag '$env:TAG'"
            exit 1
          }

          $proc = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 10

          # The app keeps its own debug log — on a crash it is the only
          # diagnostic a headless runner can offer.
          $appLog = Join-Path $env:APPDATA "ribbit\logs\debug.log"

          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) {
            $code = try { $proc.ExitCode } catch { "unknown" }
            Write-Host "::error::Ribbit exited within 10s of launch on a clean machine (exit code $code)"
            if (Test-Path $appLog) { Write-Host "--- debug.log tail ---"; Get-Content $appLog -Tail 50 }
            exit 1
          }
          Write-Host "Ribbit alive after 10s (PID $($proc.Id))"
          if (Test-Path $appLog) { Write-Host "--- debug.log tail ---"; Get-Content $appLog -Tail 20 }

          Stop-Process -Id $proc.Id -Force
          # Leave the runner clean: silent uninstall, best-effort (runners are
          # ephemeral, so a failure here is noise, not a build failure).
          $unins = Get-ChildItem (Join-Path $installDir "unins*.exe") -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($unins) {
            Start-Process -FilePath $unins.FullName -ArgumentList "/S" -Wait
            Write-Host "Uninstalled."
          }

  build-macos:
    # Native per-arch builds (arm64 + Intel), NOT a universal binary. A universal
    # (lipo'd) ad-hoc-signed bundle does not anchor macOS TCC grants reliably: the
    # microphone permission never sticks, so cpal re-triggers the system prompt on
    # every stream open and recording stays broken no matter how many times the
    # user clicks "Allow". A native per-arch bundle matches the running Mac exactly
    # and keeps the grant stable across launches. Combined with the stable
    # self-signed cert (see the keychain step below), the Accessibility/mic grants
    # now survive updates cert-to-cert — tcc_reset fires just once, on the
    # ad-hoc→cert migration. v0.7.52 shipped universal and broke the mic — this
    # keeps the proven per-arch build.
    #
    # Runs AFTER build-windows (not in parallel) on purpose: tauri-action publishes
    # latest.json by read-modify-merging the same release asset, so two jobs
    # uploading at once race on a stale read and silently drop platform keys (this
    # is what stranded Apple-Silicon users on "update failed"). The two per-arch
    # steps below run sequentially inside this one job, so the only cross-job
    # ordering left to pin is windows-before-macos.
    needs: [version, test, build-windows]
    if: needs.version.outputs.skipped != 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Rust unit tests
        working-directory: src-tauri
        # Use absolute path — macos-latest has a `cargo` shim earlier in PATH
        # that ignores rustup syntax; dtolnay installs the real cargo here.
        shell: bash
        run: "$HOME/.cargo/bin/cargo test --lib"

      # A self-signed cert only counts as a *valid* codesigning identity once its
      # root is trusted. Until then `security find-identity -v -p codesigning`
      # omits it, codesign reports "no identity found", and Tauri's bundler dies
      # with "failed to resolve signing identity". tauri-action's own
      # APPLE_CERTIFICATE import does NOT add trust, so we build the keychain
      # ourselves and trust the cert as a codeSign root (passwordless sudo on the
      # runner → no GUI auth), then hand the bundler only APPLE_SIGNING_IDENTITY.
      - name: Set up code-signing keychain (self-signed, trusted)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ribbit-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/ribbit.p12"
          CERT="$RUNNER_TEMP/ribbit-cert.pem"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$P12"

          # Dedicated keychain holds the signing identity (cert + private key).
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Let codesign use the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null

          # Our keychain first on the search list so the bundler finds the key.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # Trust the self-signed cert as a codeSign root in the System keychain.
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT"

          echo "Valid codesigning identities after trust:"
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::signing identity '$APPLE_SIGNING_IDENTITY' did not resolve"; exit 1; }

      # Two native per-arch builds, run sequentially (arm64, then Intel) inside
      # this single job. tauri-action builds AND uploads each in one step, merging
      # its platform key into the release's latest.json; running them in order —
      # and the whole job after the windows job — means no two uploads ever touch
      # latest.json at the same time, so every platform key survives. Each upload
      # can fail on a transient GitHub API timeout, so each is repeated once (the
      # rebuild is cache-warm).
      - name: Build Tauri app (Apple Silicon)
        id: build_arm
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      - name: Build Tauri app (Apple Silicon, retry)
        if: steps.build_arm.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      - name: Build Tauri app (Intel)
        id: build_intel
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target x86_64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      - name: Build Tauri app (Intel, retry)
        if: steps.build_intel.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed code signing: keychain prepared in the step above.
          # Anchoring the signature to the cert (not the cdhash) keeps the macOS
          # Accessibility grant alive across updates. Not notarized (no APPLE_ID)
          # — first launch still needs right-click→Open.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: --target x86_64-apple-darwin --bundles app,dmg
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Ribbit ${{ needs.version.outputs.tag }}
          releaseBody: ${{ needs.version.outputs.notes || 'See the assets below to download and install.' }}
          releaseDraft: false
          prerelease: true

      # Stable, version-less copies for the README download buttons (both Macs).
      # Direct links: releases/latest/download/Ribbit_macOS_*.dmg.
      - name: Publish stable-named macOS installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          arm=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          intel=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$arm" Ribbit_macOS_AppleSilicon.dmg
          cp "$intel" Ribbit_macOS_Intel.dmg
          gh release upload "$TAG" Ribbit_macOS_AppleSilicon.dmg Ribbit_macOS_Intel.dmg --clobber --repo "$GITHUB_REPOSITORY"

      # Release smoke: the bundle the user is about to install must be signed
      # (deep + strict, entitlements included), must claim the version we
      # tagged, and must actually START on a clean machine — a mismatched
      # Info.plist would have the updater offer the same version forever, and
      # a crash-at-launch build must never reach users. The app is a tray
      # utility: no window to assert on, a living process IS the smoke signal.
      - name: Smoke-test macOS bundles
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            app=$(ls -d src-tauri/target/$arch/release/bundle/macos/*.app | head -1)
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            plist_ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
            if [ "v$plist_ver" != "$TAG" ]; then
              echo "::error::$app version $plist_ver != tag $TAG"
              exit 1
            fi

            # Launch smoke: run the bundle's executable, give it 10s, require
            # the process to still be alive. Startup touches no hardware (mic
            # is only opened on hotkey; the mic-permission request is async),
            # so a clean runner user is a fair stage. Locally built binaries
            # carry no quarantine attribute, so Gatekeeper stays out of it.
            # The runner is Apple Silicon: the Intel build can only launch via
            # Rosetta, and a runner without Rosetta is NOT evidence the build
            # is broken — skip the launch (codesign/version still verified).
            native=$(uname -m)
            if [ "$arch" = "x86_64-apple-darwin" ] && [ "$native" = "arm64" ] \
               && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::notice::Rosetta unavailable — skipping launch smoke for the Intel build (codesign + version OK)"
              continue
            fi
            bin=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
            "$app/Contents/MacOS/$bin" & pid=$!
            sleep 10
            if kill -0 "$pid" 2>/dev/null; then
              echo "Ribbit ($arch) alive after 10s (PID $pid)"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            else
              code=0; wait "$pid" || code=$?
              echo "::error::Ribbit ($arch) exited within 10s of launch on a clean machine (exit code $code)"
              # The app's own debug log is the only diagnostic a headless
              # runner can offer on a startup crash.
              log="$HOME/Library/Application Support/ribbit/logs/debug.log"
              [ -f "$log" ] && { echo "--- debug.log tail ---"; tail -50 "$log"; }
              exit 1
            fi
          done

      # Guard: the in-app updater is only as good as latest.json. Fetch the
      # manifest we just published and fail the build if any platform key is
      # missing or the version is wrong — a broken manifest must never ship
      # silently again (this is exactly the bug that stranded Apple-Silicon
      # users on an old version).
      - name: Verify updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json --clobber
          node scripts/verify_manifest.mjs latest.json "$TAG"

      # Every push-built release starts as a PRERELEASE: it is the beta channel.
      # The stable channel only moves when someone promotes the release with the
      # release-control workflow. Beta installs poll a fixed moving endpoint —
      # releases/download/beta/beta.json — so this step mirrors the manifest we
      # just verified into the `beta` service release (created on first use).
      - name: Publish beta channel manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp latest.json beta.json
          if ! gh release view beta -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create beta -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Beta channel" \
              --notes "Moving target for the beta update channel"
          fi
          gh release upload beta beta.json -R "$GITHUB_REPOSITORY" --clobber

  # Release-time canary: same live-provider check as the nightly one, run
  # against the tag being shipped. A missing GROQ_API_KEY skips with a notice
  # (exit 0) and does not block promotion — same rule as canary.yml.
  release-canary:
    needs: [version, build-windows, build-macos]
    if: needs.version.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run live canary
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/canary.mjs

  # The stable channel moves only after every gate above is green: unit tests,
  # both platform builds, the install-and-launch smoke checks inside them, and
  # the live canary. That is what the prerelease window is for — once it has
  # passed there is nothing left to bake, and a release nobody promotes is a
  # release nobody receives. Demote by hand with the Release control workflow
  # (action `rollback`) if a promoted build turns out bad.
  promote:
    needs: [version, test, build-windows, build-macos, release-canary]
    if: needs.version.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote to stable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest=true
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '"stable channel now serves \(.tag_name)"'
